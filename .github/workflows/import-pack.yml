name: Import uploaded resource pack
on:
  push:
    branches: [main]
    paths: ['.import/**']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify, extract, and index pack
        run: python scripts/import_pack.py
      - name: Commit restored assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets web LICENSE pack.mcmeta pack.png .import
          git commit -m 'Restore full SkyBlock resource pack and website indexes'
          git push origin HEAD:main
